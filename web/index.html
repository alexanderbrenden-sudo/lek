<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>OW Counters</title>
<meta name="theme-color" content="#0F1420" />
<!-- Gjør at appen åpnes i fullskjerm når den er lagt til på Hjem-skjermen (iPhone). -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="OW Counters" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" type="image/png" href="icon-192.png" />
<link rel="manifest" href="manifest.json" />
<style>
  html, body { height: 100%; margin: 0; background: #0F1420; }
  body { overflow: hidden; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
  /* Fest appen til hele skjermen, så menyen alltid står helt nederst (også i fullskjerm på iPhone). */
  #root { position: fixed; top: 0; bottom: 0; left: 0; right: 0; display: flex; max-width: 480px; margin: 0 auto; background: #0F1420; }
</style>
</head>
<body>
<noscript>Appen trenger JavaScript.</noscript>
<div id="root"></div>
<script src="__BUNDLE__" defer></script>
<script>
  // Ser etter ny versjon ved oppstart og når appen hentes fram igjen, og laster den med en gang.
  (function () {
    var current = '__BUNDLE__';
    function check() {
      fetch(location.pathname, { cache: 'reload' })
        .then(function (r) { return r.text(); })
        .then(function (html) {
          var m = html.match(/_expo\/static\/js\/web\/[^"']+\.js/);
          if (m && m[0] !== current) location.reload();
        })
        .catch(function () {});
    }
    check();
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible') check();
    });
  })();
</script>
</body>
</html>
